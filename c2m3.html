<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Essentials 2 Module 3 - Answer Key Portal</title>
    <style>
        :root {
            --primary-color: #00bcd4;
            --primary-hover: #0097a7;
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #2b3a4a;
            --border-color: #e3e9f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        /* Left Navigation Sidebar */
        .sidebar {
            width: 340px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.02);
            z-index: 10;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            color: #788896;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .grid-item {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            color: #516375;
            transition: all 0.2s ease;
        }

        .grid-item:hover {
            background-color: #eef2f7;
            border-color: #cbd5e1;
        }

        .grid-item.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
        }

        /* Main Display Viewport */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            z-index: 5;
        }

        .question-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid rgba(227, 233, 240, 0.8);
            margin-top: 20px;
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: block;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* Code Block Box Styling */
        pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            overflow-x: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Multiple Choice Options CSS */
        .options-list {
            list-style: none;
        }

        .option-item {
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            background-color: #fdfdfd;
            font-size: 1rem;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .option-item::before {
            content: "";
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            margin-right: 14px;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Highlight Selected Key Style */
        .option-item.correct {
            background-color: #e6fbf7;
            border-color: #a7f3d0;
            color: #065f46;
            font-weight: 600;
        }

        .option-item.correct::before {
            border-color: #10b981;
            background-color: #10b981;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>');
            background-size: 12px;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Action Bar Navigation Footer */
        .footer-nav {
            height: 80px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #475569;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>C-Ess 2 Mod 3</h2>
        <div class="grid-container" id="number-grid"></div>
    </div>

    <div class="main-content">
        <div class="question-container">
            <div class="question-card">
                <span class="question-number" id="q-num-display">Question 1</span>
                <div class="question-text" id="q-text-display">Loading...</div>
                <pre id="code-block-container"></pre>
                <ul class="options-list" id="options-display"></ul>
            </div>
        </div>

        <div class="footer-nav">
            <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()">Previous</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <script>
        const quizData = [];

        // Q1
        quizData.push({
            id: 1,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA -2\n\nint main(void) {\n    int i = -1;\n    i += ALPHA;\n    \n    printf("%nt", 1);\n    return 0;\n}`,
            options: ["the compilation or the execution fails", "the program outputs 0", "the program outputs 2", "the program outputs 1"],
            correctIndex: 0
        });

        // Q2
        quizData.push({
            id: 2,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA -1+2\n\nint main(void) {\n    int i = -1;\n    i += ALPHA;\n    \n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs 0", "the program outputs -1", "the program outputs -3", "the program outputs -2"],
            correctIndex: 0
        });

        // Q3
        quizData.push({
            id: 3,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA -1-2\n\nint main(void) {\n    int i = -1;\n    i = i * ALPHA;\n    \n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -1", "the program outputs -2", "the program outputs -3", "the program outputs 0"],
            correctIndex: 0
        });

        // Q4
        quizData.push({
            id: 4,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA (-1-2)\n\nint main(void) {\n    int i = -1;\n    i = i * ALPHA;\n    \n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs -2", "the program outputs -1", "the program outputs 0"],
            correctIndex: 0
        });

        // Q5
        quizData.push({
            id: 5,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA -1\n#define BETA -ALPHA\n\nint main(void) {\n    int i = ALPHA + BETA * ALPHA * BETA;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -2", "the program outputs -3", "the program outputs -1", "the program outputs 1"],
            correctIndex: 0
        });

        // Q6
        quizData.push({
            id: 6,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA(x) -x\n\nint main(void) {\n    int i = ALPHA(2-1);\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs 0", "the program outputs -2", "the program outputs -1"],
            correctIndex: 0
        });

        // Q7
        quizData.push({
            id: 7,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA(x) 2*-x\n\nint main(void) {\n    int i = ALPHA(1-1);\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs 1", "the program outputs -1", "the program outputs 0"],
            correctIndex: 0
        });

        // Q8
        quizData.push({
            id: 8,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA(x, y) x##2-y\n\nint main(void) {\n    int i = -1;\n    int i2 = -2;\n    printf("%nt", ALPHA(i, i2));\n    return 0;\n}`,
            options: ["the program outputs 0", "the program outputs -1", "the program outputs -2", "the program outputs -3"],
            correctIndex: 0
        });

        // Q9
        quizData.push({
            id: 9,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define ALPHA(x, y) x+y\n\nint main(void) {\n    int i = -1;\n    int i2 = -2;\n    printf("%nt", -ALPHA(i, i2));\n    return 0;\n}`,
            options: ["the program outputs -1", "the program outputs -2", "the program outputs -3", "the program outputs 0"],
            correctIndex: 0
        });

        // Q10
        quizData.push({
            id: 10,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A(x) ((x)?-1:0)\n\nint main(void) {\n    int i = 2;\n    int i2 = A(i) * i;\n    printf("%nt", i2);\n    return 0;\n}`,
            options: ["the program outputs -2", "the program outputs -1", "the program outputs 0", "the program outputs -3"],
            correctIndex: 0
        });

        // Q11
        quizData.push({
            id: 11,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A(x) ((x)?-1:0)\n#define B(a) !(a)\n\nint main(void) {\n    int i = 2;\n    int i2 = A(B(i));\n    printf("%nt", i2);\n    return 0;\n}`,
            options: ["the program outputs 0", "the program outputs -1", "the program outputs -2", "the program outputs -3"],
            correctIndex: 0
        });

        // Q12
        quizData.push({
            id: 12,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A(x) #x\n\nint main(void) {\n    int i = -1;\n    char *s = A(i);\n    i = -(s[0] == 'i');\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -1", "the program outputs -2", "the program outputs 0", "the program outputs -3"],
            correctIndex: 0
        });

        // Q13
        quizData.push({
            id: 13,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define X 1\n#define Y 2\n\nint main(void) {\n    int i =\n#if X<<Y > 0\n    -X\n#else\n    -Y\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -1", "the program outputs -2", "the program outputs 0", "the program outputs -3"],
            correctIndex: 0
        });

        // Q14
        quizData.push({
            id: 14,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define X 1\n#define Y 2\n\nint main(void) {\n    int i =\n#if X>>Y > 0\n    -X\n#else\n    -Y\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -2", "the program outputs -3", "the program outputs -1", "the program outputs 0"],
            correctIndex: 0
        });

        // Q15
        quizData.push({
            id: 15,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n\nint main(void) {\n    int X = 1;\n#define X 1\n    int Y = X - 2;\n#undef X\n    printf("%nt", Y+X);\n    return 0;\n}`,
            options: ["the program outputs 0", "the program outputs -2", "the program outputs -1", "the program outputs -3"],
            correctIndex: 0
        });

        // Q16
        quizData.push({
            id: 16,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n\nint main(void) {\n#undef X\n    int X = 1;\n    int Y = X - 2;\n#define X -2\n    printf("%nt", Y+X);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs 0", "the program outputs -2", "the program outputs -1"],
            correctIndex: 0
        });

        // Q17
        quizData.push({
            id: 17,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A\n#define C\n\nint main(void) {\n    int i =\n#ifdef A\n#ifdef B\n    -1\n#else\n    -2\n#endif\n#else\n    -3\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -2", "the program outputs -1", "the program outputs 0", "the program outputs -3"],
            correctIndex: 0
        });

        // Q18
        quizData.push({
            id: 18,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A\n#define C\n\nint main(void) {\n    int i =\n#ifdef A\n#ifdef C\n    -1\n#else\n    -2\n#endif\n#else\n    -3\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -1", "the program outputs -3", "the program outputs 0", "the program outputs -2"],
            correctIndex: 0
        });

        // Q19
        quizData.push({
            id: 19,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A\n#define C\n\nint main(void) {\n    int i =\n#ifndef A\n#ifdef C\n    -1\n#else\n    -2\n#endif\n#else\n    -3\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs -1", "the program outputs 0", "the program outputs -2"],
            correctIndex: 0
        });

        // Q20
        quizData.push({
            id: 20,
            question: "What happens if you try to compile and run this program?",
            code: `#include <stdio.h>\n#define A\n#define C\n\nint main(void) {\n    int i =\n#ifndef A\n#ifndef C\n    -1\n#else\n    -2\n#endif\n#else\n    -3\n#endif\n    ;\n    printf("%nt", i);\n    return 0;\n}`,
            options: ["the program outputs -3", "the program outputs -1", "the program outputs -2", "the program outputs 0"],
            correctIndex: 0
        });

        let currentQuestionIndex = 0;

        const numberGrid = document.getElementById('number-grid');
        const qNumDisplay = document.getElementById('q-num-display');
        const qTextDisplay = document.getElementById('q-text-display');
        const codeBlockContainer = document.getElementById('code-block-container');
        const optionsDisplay = document.getElementById('options-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function initGrid() {
            numberGrid.innerHTML = '';
            quizData.forEach((item, index) => {
                const button = document.createElement('div');
                button.classList.add('grid-item');
                button.innerText = item.id;
                button.setAttribute('id', `grid-item-${index}`);
                button.onclick = () => loadQuestion(index);
                numberGrid.appendChild(button);
            });
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const currentData = quizData[index];

            qNumDisplay.innerText = `Question ${currentData.id}`;
            qTextDisplay.innerText = currentData.question;

            if (currentData.code) {
                codeBlockContainer.style.display = "block";
                codeBlockContainer.innerText = currentData.code;
            } else {
                codeBlockContainer.style.display = "none";
            }

            optionsDisplay.innerHTML = '';
            currentData.options.forEach((optionText, optIndex) => {
                const li = document.createElement('li');
                li.classList.add('option-item');
                li.innerText = optionText;
                
                if (optIndex === currentData.correctIndex) {
                    li.classList.add('correct');
                }
                optionsDisplay.appendChild(li);
            });

            document.querySelectorAll('.grid-item').forEach(item => item.classList.remove('active'));
            const activeGridItem = document.getElementById(`grid-item-${index}`);
            if (activeGridItem) {
                activeGridItem.classList.add('active');
                activeGridItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === quizData.length - 1);
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) loadQuestion(currentQuestionIndex + 1);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) loadQuestion(currentQuestionIndex - 1);
        }

        initGrid();
        loadQuestion(0);
    </script>
</body>
</html>
